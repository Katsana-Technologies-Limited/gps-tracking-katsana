name: Deploy (partner.katsana.com.bd)

on:
  push:
    branches: [master]

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Create .env
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > .env
          echo "VITE_BARIKOI_API_KEY=${{ secrets.VITE_BARIKOI_API_KEY }}" >> .env

      - name: Build project
        run: npm run build

      - name: Deploy to cPanel (partner.katsana.com.bd)
        uses: Samkirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: dist/
          server-dir: /vts.katsana.com.bd/
          dangerous-clean-slate: true
